name: Publish npm package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_REF_TYPE === 'tag' && process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Release tag must match v'+p.version); console.log('Preparing '+p.name+'@'+p.version)"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:hooks
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run release:npm
      - run: npm run release:npm:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: .release/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-ubuntu
          path: |
            test-results/
            playwright-report/
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifact
      - name: Publish tested tarball using npm trusted publishing
        run: npm publish ./artifact/*.tgz --access public --provenance
